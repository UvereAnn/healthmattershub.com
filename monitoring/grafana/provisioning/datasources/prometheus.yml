# ─────────────────────────────────────────────
#  Grafana Datasource Provisioning
#  Automatically connects Grafana to Prometheus
#  No manual setup needed when container starts
# ─────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # "prometheus" = Docker Compose service name
    # Grafana container resolves this via Docker DNS
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      queryTimeout: '60s'
      httpMethod: POST
