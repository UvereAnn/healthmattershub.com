# ─────────────────────────────────────────────
#  CI Pipeline — HealthMattersHub
#
#  Runs on every Pull Request targeting:
#  - main
#
#  Jobs:
#  1. lint-backend     → installs and checks backend
#  2. lint-frontend    → installs and builds frontend
#  3. docker-build     → builds both Docker images
#
#  All jobs must pass for PR to be mergeable
# ─────────────────────────────────────────────

name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

# Cancel previous runs on same PR when new commit is pushed
# Saves GitHub Actions minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Backend Checks ──────────────────
  lint-backend:
    name: Backend — Install & Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Cache node_modules based on package-lock.json
          # Speeds up subsequent runs significantly
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Step 4: Check for syntax errors
      - name: Check Node.js syntax
        working-directory: ./backend
        run: node --check server.js

      # Step 5: Verify all route files have valid syntax
      - name: Check all backend files
        working-directory: ./backend
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./uploads/*" \
            -exec node --check {} \;
          echo "✅ All backend files have valid syntax"

      # Step 6: Check that required env example exists
      - name: Verify .env.example exists
        working-directory: ./backend
        run: |
          if [ ! -f .env.example ]; then
            echo "❌ backend/.env.example is missing"
            exit 1
          fi
          echo "✅ .env.example exists"

      # Step 7: Verify health route exists
      - name: Verify health endpoint exists
        working-directory: ./backend
        run: |
          if [ ! -f routes/health.js ]; then
            echo "❌ Health route is missing"
            exit 1
          fi
          echo "✅ Health endpoint exists"

  # ── Job 2: Frontend Checks ─────────────────
  lint-frontend:
    name: Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # This is the most important check
      # If the React build fails this job fails
      # Which blocks the PR from merging
      - name: Build React app
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: http://localhost/api
          REACT_APP_SITE_NAME: HealthMattersHub
          REACT_APP_SITE_TAGLINE: Your Guide to a Healthier Life
          # Treat warnings as errors in CI
          CI: true
        run: npm run build

      # Verify the build output exists
      - name: Verify build output
        run: |
          if [ ! -f frontend/build/index.html ]; then
            echo "❌ React build failed - index.html not found"
            exit 1
          fi
          echo "✅ React build succeeded"
          echo "Build size:"
          du -sh frontend/build/

      # Upload build as artifact
      # Can be downloaded from GitHub Actions UI
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/build/
          retention-days: 7

  # ── Job 3: Docker Build Check ──────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    # Only run after both lint jobs pass
    needs: [lint-backend, lint-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build backend image
      # We do not push to registry in CI
      # Just verify it builds successfully
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: healthblog-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build frontend image
      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: healthblog-frontend:ci-test
          build-args: |
            REACT_APP_API_URL=http://localhost/api
            REACT_APP_SITE_NAME=HealthMattersHub
            REACT_APP_SITE_TAGLINE=Your Guide to a Healthier Life
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm both images built successfully
        run: |
          echo "✅ Backend Docker image built successfully"
          echo "✅ Frontend Docker image built successfully"
          echo "✅ All CI checks passed - PR is ready to merge"

  # ── Job 4: CI Summary ──────────────────────
  ci-success:
    name: CI — All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, docker-build]
    if: success()

    steps:
      - name: CI Success Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ CI PIPELINE PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Backend syntax check passed"
          echo "✅ Frontend build succeeded"
          echo "✅ Backend Docker image built"
          echo "✅ Frontend Docker image built"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "This PR is safe to merge into main"