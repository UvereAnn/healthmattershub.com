# ─────────────────────────────────────────────
#  CD Pipeline — HealthMattersHub
#
#  Triggers on: push to main branch only
#
#  What it does:
#  1. Runs CI checks first
#  2. Builds Docker images
#  3. Scans with Trivy (security)
#  4. Pushes to ECR with commit SHA tag
#  5. Updates ECS Task Definition
#  6. Deploys to Fargate (zero downtime)
#  7. Health check confirms deployment
#
#  Zero manual steps required after git push
# ─────────────────────────────────────────────

name: CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deployment at a time
# If two pushes happen quickly the second waits
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:

  # ── Job 1: CI Checks ──────────────────────
  # Must pass before any deployment starts
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install and check backend
        working-directory: ./backend
        run: |
          npm ci
          node --check server.js
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -exec node --check {} \;
          echo "✅ Backend checks passed"

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          echo "✅ Frontend build passed"
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_SITE_NAME: ${{ secrets.REACT_APP_SITE_NAME }}
          REACT_APP_SITE_TAGLINE: ${{ secrets.REACT_APP_SITE_TAGLINE }}
          CI: true

  # ── Job 2: Build Backend Image ─────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: ci-checks
    outputs:
      image: ${{ steps.build.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Get short commit SHA for image tagging
      # e.g. abc1234 instead of full 40-char SHA
      - name: Generate image metadata
        id: meta
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Image will be tagged: $SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            ${{ secrets.ECR_BACKEND_URL }}:latest
            ${{ secrets.ECR_BACKEND_URL }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # ── Trivy Security Scan ───────────────
      # Scans image for known vulnerabilities
      # Fails pipeline if CRITICAL vulnerabilities found
      # This prevents vulnerable images reaching production
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_BACKEND_URL }}:${{ steps.meta.outputs.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # If scan passes push to ECR
      - name: Push backend image to ECR
        run: |
          docker push ${{ secrets.ECR_BACKEND_URL }}:latest
          docker push ${{ secrets.ECR_BACKEND_URL }}:${{ steps.meta.outputs.sha }}
          echo "✅ Backend image pushed: ${{ steps.meta.outputs.sha }}"

      # Save Trivy results as artifact for portfolio
      - name: Save Trivy scan results
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ secrets.ECR_BACKEND_URL }}:${{ steps.meta.outputs.sha }}
          format: sarif
          output: trivy-backend-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

  # ── Job 3: Build Frontend Image ─────────────
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: ci-checks
    outputs:
      image: ${{ steps.build.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            ${{ secrets.ECR_FRONTEND_URL }}:latest
            ${{ secrets.ECR_FRONTEND_URL }}:${{ steps.meta.outputs.sha }}
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_SITE_NAME=${{ secrets.REACT_APP_SITE_NAME }}
            REACT_APP_SITE_TAGLINE=${{ secrets.REACT_APP_SITE_TAGLINE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # ── Trivy Security Scan ───────────────
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_FRONTEND_URL }}:${{ steps.meta.outputs.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push frontend image to ECR
        run: |
          docker push ${{ secrets.ECR_FRONTEND_URL }}:latest
          docker push ${{ secrets.ECR_FRONTEND_URL }}:${{ steps.meta.outputs.sha }}
          echo "✅ Frontend image pushed: ${{ steps.meta.outputs.sha }}"

      - name: Save Trivy scan results
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ secrets.ECR_FRONTEND_URL }}:${{ steps.meta.outputs.sha }}
          format: sarif
          output: trivy-frontend-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

  # ── Job 4: Deploy to Fargate ────────────────
  deploy:
    name: Deploy to AWS Fargate
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: meta
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Download the current task definition
      # We update the image tags and register a new revision
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json
          echo "✅ Task definition downloaded"
          cat task-definition.json | python3 -m json.tool | head -20

      # Update backend container image in task definition
      - name: Update backend image in task definition
        id: update-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ secrets.ECR_BACKEND_URL }}:${{ steps.meta.outputs.sha }}

      # Update frontend container image in task definition
      - name: Update frontend image in task definition
        id: update-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.update-backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ secrets.ECR_FRONTEND_URL }}:${{ steps.meta.outputs.sha }}

      # Deploy updated task definition to ECS Service
      # This triggers a rolling update
      # Old tasks stay running until new ones are healthy
      - name: Deploy to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.update-frontend.outputs.task-definition }}
          service:         ${{ secrets.ECS_SERVICE_NAME }}
          cluster:         ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Confirm deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deployment complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Commit: ${{ steps.meta.outputs.sha }}"
          echo "Backend: ${{ secrets.ECR_BACKEND_URL }}:${{ steps.meta.outputs.sha }}"
          echo "Frontend: ${{ secrets.ECR_FRONTEND_URL }}:${{ steps.meta.outputs.sha }}"

  # ── Job 5: Health Check ─────────────────────
  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      # Hit the health endpoint on ALB
      # Confirms app is responding after deployment
      - name: Health check via ALB
        run: |
          echo "Running health check..."
          MAX_RETRIES=10
          RETRY_INTERVAL=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."

            HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" \
              https://healthmattershub.com/api/health \
              --max-time 10 \
              --connect-timeout 5)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✅ HEALTH CHECK PASSED"
              echo "Status: $HTTP_STATUS"
              echo "ALB: ${{ secrets.ALB_URL }}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 0
            else
              echo "Status: $HTTP_STATUS - retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ HEALTH CHECK FAILED after $MAX_RETRIES attempts"
          echo "Last HTTP status: $HTTP_STATUS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

      # Verify specific API endpoints work
      - name: Verify API endpoints
        run: |
          BASE_URL="http://${{ secrets.ALB_URL }}"

          echo "Testing API endpoints..."

          # Test categories endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            $BASE_URL/api/categories --max-time 10)
          echo "GET /api/categories: $STATUS"
          [ "$STATUS" = "200" ] || echo "⚠️ Categories endpoint returned $STATUS"

          # Test posts endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            $BASE_URL/api/posts --max-time 10)
          echo "GET /api/posts: $STATUS"
          [ "$STATUS" = "200" ] || echo "⚠️ Posts endpoint returned $STATUS"

          # Test frontend loads
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            $BASE_URL --max-time 10)
          echo "GET /: $STATUS"
          [ "$STATUS" = "200" ] || echo "⚠️ Frontend returned $STATUS"

          echo "✅ API verification complete"

  # ── Job 6: CD Summary ───────────────────────
  cd-success:
    name: CD — Deployment Summary
    runs-on: ubuntu-latest
    needs: [health-check]
    if: success()

    steps:
      - name: Deployment Success Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ FULL CD PIPELINE COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ CI checks passed"
          echo "✅ Backend image built and scanned"
          echo "✅ Frontend image built and scanned"
          echo "✅ No CRITICAL vulnerabilities found"
          echo "✅ Images pushed to ECR"
          echo "✅ ECS task definition updated"
          echo "✅ Fargate deployment complete"
          echo "✅ Health check passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Site: http://${{ secrets.ALB_URL }}"
          echo "🔑 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
