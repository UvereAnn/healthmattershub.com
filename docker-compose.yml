# ─────────────────────────────────────────────
#  HealthMattersHub — Local Development
#  Docker Compose Configuration
#
#  Usage:
#    Start:   docker compose up --build
#    Stop:    docker compose down
#    Logs:    docker compose logs -f
#    Restart: docker compose restart
# ─────────────────────────────────────────────

version: '3.8'

# ── Networks ────────────────────────────────
# All containers communicate on this private network
# Containers reference each other by service name
# e.g. backend can reach frontend at http://frontend:80
networks:
  healthblog-network:
    driver: bridge

# ── Volumes ─────────────────────────────────
# Persist uploaded images between container restarts
# Without this uploads disappear when container stops
volumes:
  uploads-data:
    driver: local

# ── Services ────────────────────────────────
services:

  # ── Backend (Node.js + Express) ───────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthblog-backend
    restart: unless-stopped

    # Environment variables
    # Reads from backend/.env file
    env_file:
      - ./backend/.env

    # Override NODE_ENV for local docker testing
    environment:
      - NODE_ENV=development

    # Port mapping
    # We do NOT expose 5000 to host in production
    # Only Nginx should reach the backend
    # But we expose it here for local testing/debugging
    ports:
      - "5000:5000"

    # Mount uploads folder as a volume
    # So uploaded images persist between restarts
    volumes:
      - uploads-data:/app/uploads

    # Health check
    # Docker waits for this before starting nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Connect to shared network
    networks:
      - healthblog-network

  # ── Frontend (React + Nginx) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass environment variables at build time
        # React bakes these into the JS bundle
        # For local docker: API goes through Nginx on port 80
        - REACT_APP_API_URL=http://localhost/api
        - REACT_APP_SITE_NAME=HealthMattersHub
        - REACT_APP_SITE_TAGLINE=Your Guide to a Healthier Life
    container_name: healthblog-frontend
    restart: unless-stopped

    # Frontend does not need to expose port to host
    # Nginx reverse proxy handles all incoming traffic
    # We keep it internal only
    expose:
      - "80"

    # Health check
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Only start after backend is healthy
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - healthblog-network

  # ── Nginx (Reverse Proxy) ─────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: healthblog-nginx
    restart: unless-stopped

    # THIS is the only container exposed to the outside world
    # All traffic enters here
    ports:
      - "80:80"

    # Health check
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Only start after both backend and frontend are healthy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    networks:
      - healthblog-network