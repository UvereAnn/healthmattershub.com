# ─────────────────────────────────────────────
#  HealthMattersHub — Local Development
#  Docker Compose Configuration
# ─────────────────────────────────────────────

version: '3.8'

# ── Networks ────────────────────────────────
networks:
  healthblog-network:
    driver: bridge

# ── Volumes ─────────────────────────────────
volumes:
  uploads-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Services ────────────────────────────────
services:

  # ── Backend (Node.js + Express) ───────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthblog-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - healthblog-network

  # ── Frontend (React + Nginx) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost/api
        - REACT_APP_SITE_NAME=HealthMattersHub
        - REACT_APP_SITE_TAGLINE=Your Guide to a Healthier Life
    container_name: healthblog-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - healthblog-network

  # ── Nginx (Reverse Proxy) ─────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: healthblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - healthblog-network

  # ── Prometheus (Metrics Collection) ───────
  prometheus:
    image: prom/prometheus:latest
    container_name: healthblog-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - healthblog-network      

  # ── Nginx Metrics Exporter ──────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: healthblog-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx-health
    ports:
      - "9113:9113"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - healthblog-network


# ── Grafana (Visualization) ───────────────
  grafana:
    image: grafana/grafana:latest
    container_name: healthblog-grafana
    restart: unless-stopped

    ports:
      - "3001:3001"

    env_file:
      - ./monitoring/grafana.env

    volumes:
      # Persist Grafana data (dashboards saved in UI, users etc)
      - grafana-data:/var/lib/grafana
      # Auto-provision datasources
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Auto-provision dashboard configs
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Dashboard JSON files
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    depends_on:
      prometheus:
        condition: service_healthy

    networks:
      - healthblog-network