# ─────────────────────────────────────────────
#  Nginx Reverse Proxy Configuration
#  Sits in front of both frontend and backend
#  Single entry point for all traffic
# ─────────────────────────────────────────────

# How many worker processes to spawn
# auto = one per CPU core
worker_processes auto;

events {
    # Max connections per worker
    worker_connections 1024;
}

http {
    # Include MIME types (tells browser what kind of file it is)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ── Gzip Compression ──────────────────────
    # Compresses responses before sending to browser
    # Makes pages load faster
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        application/xml
        application/rss+xml;

    # ── Upstream Servers ──────────────────────
    # These names match the service names in docker-compose.yml
    # Docker DNS resolves these names automatically

    upstream backend {
        # "backend" = service name in docker-compose
        # Docker resolves this to the backend container IP
        server backend:5000;
    }

    upstream frontend {
        # "frontend" = service name in docker-compose
        server frontend:80;
    }

    # ── Main Server Block ─────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ──────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        server_tokens off;

        # ── API Routes → Backend ──────────────
        # Any request starting with /api goes to Node.js
        location /api {
            proxy_pass http://backend;

            # Pass real client IP to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Disable buffering for real-time responses
            proxy_buffering off;
        }

        # ── Uploads → Backend ─────────────────
        # Uploaded images served directly from backend
        location /uploads {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache uploaded images for 30 days
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ── Health Check ──────────────────────
        # Nginx itself responds to /health
        # Used by Docker and AWS to check if Nginx is alive
        location /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # ── Everything Else → Frontend ────────
        # React app handles all other routes
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important for React Router
            # If frontend returns 404 fall back to index.html
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        location @frontend_fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}