# Nginx configuration for React frontend container

server {
    listen 80;
    server_name _;

    # Root directory where React build files live
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression - makes files smaller = faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Cache static assets aggressively
    # Browser caches JS/CSS/images for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router support
    # ALL routes return index.html
    # React Router then handles the routing in the browser
    # Without this, refreshing /blog/my-post gives 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide Nginx version from attackers
    server_tokens off;

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}